; esp32s3_board — ESP32-S3 N16R8V board bring-up (chip/flash/SRAM/PSRAM
; diagnostic firmware, ported from esp32_chip_info_test, OTA + remote-config
; left in the codebase but switched off — see main/config.h).
;
; Created via `pio project init` (not hand-written) per
; docs/TestFunctionalities/display/92_2026-07-21_platformio_espidf_file_architecture_complete_guide.md
; — only board/env name/src_dir/board_build.*/build_flags were edited by hand
; afterward; nothing here was fabricated from scratch.
[platformio]
src_dir = main
; Custom board lives in boards/ (PlatformIO's default folder name — no
; boards_dir override needed). Real hardware manifest confirmed via
; esptool flash_id on this exact board family (16MB flash, 8MB Octal
; PSRAM) — copied verbatim from esp32_wave_board_test/boards/, NOT the
; stock "esp32-s3-devkitc-1" board (which wrongly reports 8MB/no PSRAM).

[env:esp32s3_board]
platform  = espressif32@6.10.0
board     = esp32-s3-devkitc-1-n16r8v
framework = espidf

; ── Serial — not decided yet (2026-07-23). Uncomment + fill in before
; the first real upload. PlatformIO auto-detects if left commented, but
; auto-detect can pick the wrong port when multiple COM devices exist.
; upload_port   = COM8
; monitor_port  = COM8
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

; ── Board — real hardware spec (16MB flash, 8MB Octal PSRAM). Both
; board_build.flash_size AND board_upload.flash_size are set (the stock
; board's own manifest bug — declaring flash size under "upload" instead
; of "build" — otherwise silently overrides board_build alone; see
; esp32_wave_board_test/platformio.ini's own note on this).
board_build.mcu         = esp32s3
board_build.flash_size  = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode  = dio
board_build.f_cpu       = 240000000L
board_build.partitions  = partitions_16mb.csv

build_flags =
    -DIDF_TARGET=esp32s3
    -DCORE_DEBUG_LEVEL=3
    ; ── LVGL — display feature (ported from esp32_display_taxi_3) ──
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_FONT_MONTSERRAT_10=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_48=1
    -DLV_USE_FLEX=1
    -DLV_USE_GRID=1
    -DLV_USE_SLIDER=1
    -DLV_USE_COLORWHEEL=1
    -DLV_USE_SPINNER=1
